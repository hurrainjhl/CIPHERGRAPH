version: '3.8'

services:
  neo4j:
    image: neo4j:5.21.0
    container_name: ciphergraph-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ciphergraph-backend
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j_data:
